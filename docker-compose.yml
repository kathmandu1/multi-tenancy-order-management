version: '3.9'
services:

  web:
    image: nginx:stable-alpine
    volumes:
      - ./:/var/www/html:cached
      - .docker/nginx/vhost.conf:/etc/nginx/conf.d/default.conf
      - .docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./logs:/var/log/nginx  # Mount a volume to persist Nginx logs to the host
    links:
      - app
    ports:
      # - "80:80"
      - "${APP_PORT}:80"
    restart: unless-stopped
    networks:
      - hazesoft

  app:
    build:
      context: .
      args:
        user: php
        uid: 1000
      dockerfile: develop.Dockerfile
    volumes:
      - ./:/var/www/html:cached
      - ./tests/coverage:/opt/phpstorm-coverage
      - .docker/php/php_settings.ini:/usr/local/etc/php/conf.d/99-override.ini
      - .docker/php/xdebug.ini:/usr/local/etc/php/conf.d/20-xdebug.ini
    restart: unless-stopped
    environment:
      CONTAINER_ID: $(docker-compose ps -q app)
    networks:
      - hazesoft

  db:
    image: mysql:8.0
    command: --init-file /usr/local/etc/mysql/init.sql
    volumes:
      - mysql-data:/var/lib/mysql
      - .docker/mysql/conf.d:/etc/mysql/conf.d
      - .docker/mysql/init/init.sql:/usr/local/etc/mysql/init.sql
    environment:
      MYSQL_ROOT_PASSWORD: '@dmin@123'
      MYSQL_DATABASE: hazesoft
    restart: unless-stopped
    ports:
      - "8003:3306"
    networks:
      - hazesoft
#   mail:
#     image: maildev/maildev
#     ports:
#         - "1025:1025"
#         - "9002:1080"
#     restart: unless-stopped
#     networks:
#         - hazesoft

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8080:80"
    networks:
      - hazesoft
    environment:
      PMA_HOST: 'db'
      PMA_PORT: '3306'
      PMA_USER: 'root'
      PMA_PASSWORD: '@dmin@123'
      UPLOAD_LIMIT: 3048M  # Set the limit to  2 gb
      PMA_UPLOAD_MAX_SIZE: 3048M
      PMA_POST_MAX_SIZE: 3048M
      NGINX_CLIENT_MAX_BODY_SIZE: 3048
    depends_on:
      - db
    # volumes:
    #   - ./data:/var/www/html

  queue:
    build:
      context: ./worker
      args:
        - PUID=${HOST_PUID}
        - PGID=${HOST_PGID}
        - APP_CODE_PATH=${APP_CODE_PATH_CONTAINER}
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      CONTAINER_ROLE: queue
      # CACHE_DRIVER: redis
      # SESSION_DRIVER: redis
      # QUEUE_DRIVER: redis
      # REDIS_HOST: redis
    networks:
      - hazesoft

